<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Attendance | Student Attendance Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E3A8A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app" id="app">
    <div class="main">
      <main class="content" id="content" tabindex="-1">

        <div class="page-header">
          <div>
            <h1>Mark Attendance</h1>
            <p class="page-subtitle">Choose the date and class, then record each student's attendance.</p>
          </div>
        </div>

        <section class="card section" aria-label="Attendance filters">
          <div class="card-body">
            <form id="filter-form" novalidate>
              <div class="form-row">
                <div class="form-group">
                  <label for="date">Date <span class="required" aria-hidden="true">*</span></label>
                  <input id="date" type="date" class="form-control" required>
                  <p id="date-error" class="field-error"></p>
                </div>
                <div class="form-group">
                  <label for="class">Class <span class="required" aria-hidden="true">*</span></label>
                  <select id="class" class="form-control" required disabled><option value="">Loading classes...</option></select>
                  <p id="class-error" class="field-error"></p>
                </div>
                <div class="form-group">
                  <label for="course">Course/Program <span class="required" aria-hidden="true">*</span></label>
                  <select id="course" class="form-control" required disabled><option value="">Select a class first</option></select>
                  <p id="course-error" class="field-error"></p>
                </div>
                <div class="form-group">
                  <label for="session">Session</label>
                  <select id="session" class="form-control"></select>
                </div>
              </div>
              <button type="submit" id="load-btn" class="btn btn-primary" disabled>Load Students</button>
            </form>
          </div>
        </section>

        <div id="sheet"></div>

      </main>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/lookups.js"></script>
  <script src="/js/attendance.js"></script>
</body>
</html>
