<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Student Attendance Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E3A8A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app" id="app">
    <div class="main">
      <main class="content" id="content" tabindex="-1">

        <div class="page-header">
          <div>
            <h1>Profile</h1>
            <p class="page-subtitle">Manage your account details and password.</p>
          </div>
        </div>

        <div id="status-area"></div>

        <div id="profile-body" class="hidden">

          <section class="card section" aria-label="Account summary">
            <div class="card-body profile-head">
              <span class="avatar avatar-lg" id="head-avatar" aria-hidden="true"></span>
              <div>
                <h2 class="profile-name" id="head-name"></h2>
                <p class="text-muted" id="head-email" style="margin:0 0 8px"></p>
                <div class="profile-badges"><span id="head-role" class="badge"></span><span id="head-status" class="badge"></span></div>
              </div>
            </div>
          </section>

          <section id="academic" class="card section hidden" aria-labelledby="academic-title">
            <div class="card-header"><h2 id="academic-title">Student information</h2></div>
            <div class="card-body"><div class="info-grid" id="academic-grid"></div></div>
          </section>

          <div class="profile-grid">

            <!-- Personal information -->
            <section class="card" aria-labelledby="info-title">
              <div class="card-header"><h2 id="info-title">Personal information</h2></div>
              <div class="card-body">
                <form id="info-form" novalidate>
                  <div id="info-alert" class="alert hidden" role="alert"></div>

                  <div class="form-group">
                    <label for="full-name">Full Name <span class="required" aria-hidden="true">*</span></label>
                    <input id="full-name" type="text" class="form-control" autocomplete="name" maxlength="100" required>
                    <p id="full-name-error" class="field-error"></p>
                  </div>
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" class="form-control" disabled>
                    <p class="field-hint">Contact your administrator to change your email address.</p>
                  </div>
                  <div class="form-group">
                    <label for="role">Role</label>
                    <input id="role" type="text" class="form-control" disabled>
                  </div>
                  <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input id="phone" type="tel" class="form-control" autocomplete="tel" placeholder="e.g. 0712345678">
                    <p id="phone-error" class="field-error"></p>
                  </div>

                  <div class="form-actions">
                    <button type="submit" id="info-btn" class="btn btn-primary">Save Changes</button>
                  </div>
                </form>
              </div>
            </section>

            <!-- Security: change password -->
            <section class="card" id="security" aria-labelledby="security-title">
              <div class="card-header"><h2 id="security-title">Security</h2></div>
              <div class="card-body">
                <p class="field-hint" id="pw-last" style="margin:0 0 16px"></p>

                <form id="password-form" novalidate>
                  <div id="pw-alert" class="alert hidden" role="alert"></div>

                  <div class="form-group">
                    <label for="current-password">Current Password <span class="required" aria-hidden="true">*</span></label>
                    <div class="input-icon">
                      <span data-icon="lock"></span>
                      <input id="current-password" type="password" class="form-control has-toggle" autocomplete="current-password" placeholder="Enter your current password">
                      <button type="button" class="input-toggle" data-toggle="current-password" data-label="current password"></button>
                    </div>
                    <p id="current-password-error" class="field-error"></p>
                  </div>

                  <div class="form-group">
                    <label for="new-password">New Password <span class="required" aria-hidden="true">*</span></label>
                    <div class="input-icon">
                      <span data-icon="lock"></span>
                      <input id="new-password" type="password" class="form-control has-toggle" autocomplete="new-password" placeholder="Enter a new password">
                      <button type="button" class="input-toggle" data-toggle="new-password" data-label="new password"></button>
                    </div>
                    <p id="new-password-error" class="field-error"></p>
                    <ul class="pw-rules" aria-label="Password requirements">
                      <li id="rule-length">At least 8 characters</li>
                      <li id="rule-upper">One uppercase letter</li>
                      <li id="rule-lower">One lowercase letter</li>
                      <li id="rule-number">One number</li>
                    </ul>
                  </div>

                  <div class="form-group">
                    <label for="confirm-password">Confirm New Password <span class="required" aria-hidden="true">*</span></label>
                    <div class="input-icon">
                      <span data-icon="lock"></span>
                      <input id="confirm-password" type="password" class="form-control has-toggle" autocomplete="new-password" placeholder="Re-enter the new password">
                      <button type="button" class="input-toggle" data-toggle="confirm-password" data-label="password confirmation"></button>
                    </div>
                    <p id="confirm-password-error" class="field-error"></p>
                  </div>

                  <div class="form-actions">
                    <button type="submit" id="pw-btn" class="btn btn-primary">Change Password</button>
                  </div>
                </form>
              </div>
            </section>

          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
