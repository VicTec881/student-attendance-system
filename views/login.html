<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Student Attendance Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E3A8A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
  <main class="auth">

    <!-- Branding side (gradient) -->
    <section class="auth-brand" aria-label="About the system">
      <div class="brand-top">
        <span class="brand-logo" data-icon="graduation-cap" data-size="24"></span>
        <span>SAMS</span>
      </div>

      <div class="brand-main">
        <div class="brand-copy">
          <h1>STUDENT ATTENDANCE<br>MANAGEMENT SYSTEM</h1>
          <p>Manage student attendance easily, securely and efficiently.</p>
        </div>

        <svg class="brand-illustration" viewBox="0 0 420 300" role="img" aria-label="Illustration of a class attendance sheet" xmlns="http://www.w3.org/2000/svg">
          <circle cx="48" cy="52" r="40" fill="#fff" opacity=".08"/>
          <circle cx="392" cy="262" r="52" fill="#fff" opacity=".08"/>
          <rect x="30" y="36" width="350" height="230" rx="16" fill="#fff"/>
          <path d="M46 36h318a16 16 0 0 1 16 16v32H30V52a16 16 0 0 1 16-16z" fill="#DBEAFE"/>
          <text x="52" y="66" font-size="15" font-weight="700" fill="#1E3A8A">Class Attendance</text>
          <text x="356" y="66" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="end">Year 2</text>

          <circle cx="64" cy="118" r="15" fill="#BFDBFE"/>
          <rect x="90" y="108" width="112" height="9" rx="4.5" fill="#CBD5E1"/>
          <rect x="90" y="123" width="70" height="7" rx="3.5" fill="#E2E8F0"/>
          <rect x="268" y="105" width="88" height="26" rx="13" fill="#DCFCE7"/>
          <text x="312" y="122" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Present</text>
          <line x1="50" y1="146" x2="360" y2="146" stroke="#E2E8F0"/>

          <circle cx="64" cy="176" r="15" fill="#BFDBFE"/>
          <rect x="90" y="166" width="96" height="9" rx="4.5" fill="#CBD5E1"/>
          <rect x="90" y="181" width="60" height="7" rx="3.5" fill="#E2E8F0"/>
          <rect x="268" y="163" width="88" height="26" rx="13" fill="#FEE2E2"/>
          <text x="312" y="180" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle">Absent</text>
          <line x1="50" y1="204" x2="360" y2="204" stroke="#E2E8F0"/>

          <circle cx="64" cy="234" r="15" fill="#BFDBFE"/>
          <rect x="90" y="224" width="104" height="9" rx="4.5" fill="#CBD5E1"/>
          <rect x="90" y="239" width="66" height="7" rx="3.5" fill="#E2E8F0"/>
          <rect x="268" y="221" width="88" height="26" rx="13" fill="#FEF3C7"/>
          <text x="312" y="238" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Leave</text>

          <circle cx="380" cy="36" r="26" fill="#16A34A" stroke="#fff" stroke-width="4"/>
          <polyline points="368,36 377,45 392,28" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="34" cy="262" r="28" fill="#F59E0B" stroke="#fff" stroke-width="4"/>
          <text x="34" y="267" font-size="14" font-weight="800" fill="#78350F" text-anchor="middle">92%</text>
        </svg>
      </div>

      <p class="brand-footer">For students, teachers and administrators.</p>
    </section>

    <!-- Login side -->
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-logo" data-icon="graduation-cap" data-size="28"></div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue to your account.</p>

        <div id="form-alert" class="alert hidden" role="alert" aria-live="assertive"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
            <div class="input-icon">
              <span data-icon="mail"></span>
              <input id="email" name="email" type="email" class="form-control"
                     placeholder="you@school.com" autocomplete="username"
                     aria-describedby="email-error" required>
            </div>
            <p id="email-error" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
            <div class="input-icon">
              <span data-icon="lock"></span>
              <input id="password" name="password" type="password" class="form-control has-toggle"
                     placeholder="Enter your password" autocomplete="current-password"
                     aria-describedby="password-error" required>
              <button type="button" id="toggle-password" class="input-toggle"
                      aria-label="Show password" aria-pressed="false"></button>
            </div>
            <p id="password-error" class="field-error"></p>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>

        <p class="auth-help">Forgot your password? Please contact your school administrator.</p>
      </div>
    </section>

  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
